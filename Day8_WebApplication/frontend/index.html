<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Database - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Faculty Database System</h1>
            <p>College Management Portal</p>
        
        <form id="loginForm">
            <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
            </div>
            
                <button type="submit" class="btn btn-primary">Login</button>
                
                <button type="button" class="btn btn-secondary" onclick="guestLogin()">Continue as Guest</button>
        </form>
        
            <div id="error-message" class="error-message"></div>
            
            <div class="credentials-info">
                <h4>Demo Credentials:</h4>
                <p><strong>Admin:</strong> admin / admin123</p>
                <p><strong>Faculty:</strong> prof1 / prof123</p>
                <p><strong>Guest:</strong> Click "Continue as Guest" for read-only access</p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            try {
                const response = await fetch('http://localhost:8080/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store auth token
                    const token = username + ':' + data.role;
                    sessionStorage.setItem('authToken', 'Bearer ' + token);
                    sessionStorage.setItem('username', data.username);
                    sessionStorage.setItem('role', data.role);
                    if (data.faculty_id) {
                        sessionStorage.setItem('faculty_id', data.faculty_id);
                    }
                    
                    // Redirect based on role
                    if (data.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (data.role === 'faculty') {
                        window.location.href = 'faculty.html';
                    }
                } else {
                    errorDiv.textContent = data.message || 'Login failed';
                }
            } catch (error) {
                errorDiv.textContent = 'Error during login: ' + error;
            }
        });
        
        function guestLogin() {
            sessionStorage.setItem('role', 'guest');
            sessionStorage.setItem('username', 'Guest User');
            window.location.href = 'student.html';
        }
    </script>
</body>
</html>
