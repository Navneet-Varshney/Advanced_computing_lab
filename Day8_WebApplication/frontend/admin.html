<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Faculty Database</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-cog"></i> Admin Dashboard</h1>
        <div class="nav-buttons">
            <span><i class="fas fa-user-circle"></i> <span id="username-display"></span></span>
            <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard">
            <!-- Action Buttons -->
            <div class="action-buttons">
                <button onclick="showAddForm()" class="btn btn-success"><i class="fas fa-plus"></i> Add Faculty</button>
                <input type="text" id="searchInput" placeholder="🔍 Search by name, department, email, specialization, or designation..." class="search-box">
                <button onclick="searchFaculty()" class="btn btn-info"><i class="fas fa-search"></i> Search</button>
                <button onclick="resetAdminSearch()" class="btn btn-secondary"><i class="fas fa-redo"></i> Show All</button>
        </div>
        
            <!-- Add Faculty Form (Modal) -->
            <div id="addFormModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <span onclick="closeAddForm()" class="close">&times;</span>
                    <h2><i class="fas fa-user-plus"></i> Add New Faculty</h2>
                    <div id="addFormError" class="error-message"></div>
                    <div id="addFormSuccess" class="success-message"></div>
                    <form id="addFacultyForm">
                        <div class="form-group">
                            <label for="faculty_id"><i class="fas fa-id-badge"></i> Faculty ID</label>
                            <input type="text" id="faculty_id" name="faculty_id" placeholder="e.g., 141" required>
                        </div>
                        <div class="form-group">
                            <label for="name"><i class="fas fa-user"></i> Full Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter full name" required>
                        </div>
                        <div class="form-group">
                            <label for="department"><i class="fas fa-building"></i> Department</label>
                            <input type="text" id="department" name="department" placeholder="e.g., Mechanical Engineering" required>
                        </div>
                        <div class="form-group">
                            <label for="username"><i class="fas fa-user-tag"></i> Username</label>
                            <input type="text" id="username" name="username" placeholder="Optional - auto-generated if empty">
                        </div>
                        <div class="form-group">
                            <label for="designation"><i class="fas fa-briefcase"></i> Designation</label>
                            <select id="designation" name="designation" required>
                                <option>Select Designation</option>
                                <option>Chairman & Professor</option>
                                <option>Professor</option>
                                <option>Associate Professor</option>
                                <option>Assistant Professor</option>
                                <option>Guest Faculty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mobile"><i class="fas fa-phone"></i> Mobile</label>
                            <input type="tel" id="mobile" name="mobile" placeholder="10-digit number" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label for="email"><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="email" name="email" placeholder="user@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="specialization"><i class="fas fa-lightbulb"></i> Specialization</label>
                            <input type="text" id="specialization" name="specialization" placeholder="e.g., Machine Design" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;"><i class="fas fa-check"></i> Add Faculty</button>
                        <button type="button" onclick="closeAddForm()" class="btn btn-secondary" style="width: 100%; justify-content: center; margin-top: 10px;"><i class="fas fa-times"></i> Cancel</button>
                    </form>
                </div>
            </div>
            
            <!-- Edit Faculty Form (Modal) -->
            <div id="editFormModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <span onclick="closeEditForm()" class="close">&times;</span>
                    <h2>Edit Faculty Member</h2>
                    <form id="editFacultyForm">
                        <input type="hidden" id="edit_faculty_id">
                        <div class="form-group">
                            <label for="edit_name">Name:</label>
                            <input type="text" id="edit_name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_department">Department:</label>
                            <input type="text" id="edit_department" name="department" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_designation">Designation:</label>
                            <select id="edit_designation" name="designation" required>
                                <option>Select Designation</option>
                                <option>Chairman & Professor</option>
                                <option>Professor</option>
                                <option>Associate Professor</option>
                                <option>Assistant Professor</option>
                                <option>Lecturer</option>
                                <option>Guest Faculty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="edit_mobile">Mobile:</label>
                            <input type="tel" id="edit_mobile" name="mobile" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_email">Email:</label>
                            <input type="email" id="edit_email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_specialization">Specialization:</label>
                            <input type="text" id="edit_specialization" name="specialization" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Faculty</button>
                        <button type="button" onclick="closeEditForm()" class="btn btn-secondary">Cancel</button>
                    </form>
                </div>
            </div>
            
            <!-- Faculty Table -->
            <div class="table-container">
                <table id="facultyTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Specialization</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="facultyTableBody">
                    </tbody>
                </table>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Load faculty data on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth('admin');
            loadFaculty();
        });
        
        // Add faculty form submission
        document.getElementById('addFacultyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Clear previous messages
            document.getElementById('addFormError').style.display = 'none';
            document.getElementById('addFormSuccess').style.display = 'none';
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch(API_BASE + '/api/faculty', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': sessionStorage.getItem('authToken')
                    },
                    body: JSON.stringify(data)
                })
                
                const result = await response.json();
            
                if (response.status === 409) {
                    // Duplicate faculty ID error
                    const suggestedIds = result.suggested_ids ? result.suggested_ids.split(',') : [];
                    let errorMsg = '<strong>' + result.message + '</strong>';
                    
                    if (suggestedIds.length > 0) {
                        errorMsg += '<br><br><strong>Suggested available IDs:</strong> ' + suggestedIds.join(', ');
                    }
                    
                    document.getElementById('addFormError').innerHTML = errorMsg;
                    document.getElementById('addFormError').style.display = 'block';
                    showMessage(result.message + ' Suggested IDs: ' + suggestedIds.join(', '), 'error');
                } else if (result.success) {
                    document.getElementById('addFormSuccess').innerHTML = '<strong>✓ Faculty added successfully!</strong><br>Username: ' + result.username + '<br>Generated Password: ' + result.generated_password;
                    document.getElementById('addFormSuccess').style.display = 'block';
                    showMessage('Faculty added successfully!', 'success');
                    setTimeout(() => {
                        closeAddForm();
                        loadFaculty();
                        this.reset();
                    }, 2000);
                } else {
                    document.getElementById('addFormError').textContent = result.message || 'Error adding faculty';
                    document.getElementById('addFormError').style.display = 'block';
                    showMessage(result.message || 'Error adding faculty', 'error');
                }
            } catch (error) {
                document.getElementById('addFormError').textContent = 'Error: ' + error;
                document.getElementById('addFormError').style.display = 'block';
                showMessage('Error: ' + error, 'error');
            }
        });
        
        // Edit faculty form submission
        document.getElementById('editFacultyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const facultyId = document.getElementById('edit_faculty_id').value;
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch(API_BASE + `/api/faculty/${facultyId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': sessionStorage.getItem('authToken')
                    },
                    body: JSON.stringify(data)
                })
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Faculty updated successfully!', 'success');
                    closeEditForm();
                    loadFaculty();
                } else {
                    showMessage(result.message || 'Error updating faculty', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error, 'error');
            }
        });
        
        function loadFaculty() {
            fetch(API_BASE + '/api/faculty', {
                headers: {
                    'Authorization': sessionStorage.getItem('authToken')
                }
            })
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('facultyTableBody');
                tbody.innerHTML = '';
                
                if (Array.isArray(data)) {
                    // Sort by faculty_id numerically
                    data.sort((a, b) => {
                        const idA = parseInt(a.faculty_id) || 999999;
                        const idB = parseInt(b.faculty_id) || 999999;
                        return idA - idB;
                    });
                    
                    data.forEach(person => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${person.faculty_id}</td>
                            <td>${person.name}</td>
                            <td>${person.department}</td>
                            <td>${person.designation}</td>
                            <td>${person.mobile}</td>
                            <td>${person.email}</td>
                            <td>${person.specialization}</td>
                            <td>
                                <button onclick="editFaculty('${person.faculty_id}')" class="btn btn-small btn-info">✏️ Edit</button>
                                <button onclick="deleteFaculty('${person.faculty_id}')" class="btn btn-small btn-danger">🗑️ Delete</button>
                            </td>
                        `;
                    });
                }
            })
            .catch(err => showMessage('Error loading faculty: ' + err, 'error'));
        }
        
        function showAddForm() {
            document.getElementById('addFormModal').style.display = 'block';
            }
            
        function closeAddForm() {
            document.getElementById('addFormModal').style.display = 'none';
        }
        
        function editFaculty(facultyId) {
            fetch(API_BASE + `/api/faculty/${facultyId}`, {
                headers: {
                    'Authorization': sessionStorage.getItem('authToken')
                }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('edit_faculty_id').value = data.faculty_id;
                document.getElementById('edit_name').value = data.name;
                document.getElementById('edit_department').value = data.department;
                document.getElementById('edit_designation').value = data.designation;
                document.getElementById('edit_mobile').value = data.mobile;
                document.getElementById('edit_email').value = data.email;
                document.getElementById('edit_specialization').value = data.specialization;
                
                document.getElementById('editFormModal').style.display = 'block';
            })
            .catch(err => showMessage('Error loading faculty data: ' + err, 'error'));
        }
        
        function closeEditForm() {
            document.getElementById('editFormModal').style.display = 'none';
        }
        
        function deleteFaculty(facultyId) {
            if (confirm('Are you sure you want to delete this faculty member?')) {
                fetch(API_BASE + `/api/faculty/${facultyId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': sessionStorage.getItem('authToken')
                    }
                })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        showMessage('Faculty deleted successfully!', 'success');
                        loadFaculty();
                    } else {
                        showMessage(result.message || 'Error deleting faculty', 'error');
                    }
                })
                .catch(err => showMessage('Error: ' + err, 'error'));
            }
        }
        
        function searchFaculty() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                    loadFaculty();
                return;
            }
            
            fetch(API_BASE + `/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('facultyTableBody');
                tbody.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(person => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${person.faculty_id}</td>
                            <td>${person.name}</td>
                            <td>${person.department}</td>
                            <td>${person.designation}</td>
                            <td>${person.mobile}</td>
                            <td>${person.email}</td>
                            <td>${person.specialization}</td>
                            <td>
                                <button onclick="editFaculty('${person.faculty_id}')" class="btn btn-small btn-info">✏️ Edit</button>
                                <button onclick="deleteFaculty('${person.faculty_id}')" class="btn btn-small btn-danger">🗑️ Delete</button>
                            </td>
                        `;
                    });
                    showMessage(`Found ${data.count} result(s)`, 'success');
                } else {
                    showMessage('No results found', 'info');
                }
            })
            .catch(err => showMessage('Search error: ' + err, 'error'));
        }
        
        function resetAdminSearch() {
            document.getElementById('searchInput').value = '';
            loadFaculty();
        }
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'message ' + type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }, 4000);
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
                }
        
        // Display username
        document.getElementById('username-display').textContent = 'Welcome, ' + sessionStorage.getItem('username');
    </script>
</body>
</html>
