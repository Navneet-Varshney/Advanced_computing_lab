<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Faculty Database</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>📋 Faculty Database - Admin Dashboard</h1>
        <div class="nav-buttons">
            <span id="username-display"></span>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard">
            <!-- Action Buttons -->
            <div class="action-buttons">
                <button onclick="showAddForm()" class="btn btn-success">+ Add New Faculty</button>
                <input type="text" id="searchInput" placeholder="Search by name, department, or specialization..." class="search-box">
                <button onclick="searchFaculty()" class="btn btn-info">🔍 Search</button>
        </div>
        
            <!-- Add Faculty Form (Modal) -->
            <div id="addFormModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <span onclick="closeAddForm()" class="close">&times;</span>
                    <h2>Add New Faculty Member</h2>
                    <form id="addFacultyForm">
                        <div class="form-group">
                            <label for="faculty_id">Faculty ID:</label>
                            <input type="text" id="faculty_id" name="faculty_id" required>
                        </div>
                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="department">Department:</label>
                            <input type="text" id="department" name="department" required>
                        </div>
                        <div class="form-group">
                            <label for="designation">Designation:</label>
                            <select id="designation" name="designation" required>
                                <option>Select Designation</option>
                                <option>Professor</option>
                                <option>Associate Professor</option>
                                <option>Assistant Professor</option>
                                <option>Guest Faculty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mobile">Mobile:</label>
                            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="specialization">Specialization:</label>
                            <input type="text" id="specialization" name="specialization" required>
                        </div>
                        <div class="form-group">
                            <label for="username">Username (optional):</label>
                            <input type="text" id="username" name="username">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Faculty</button>
                        <button type="button" onclick="closeAddForm()" class="btn btn-secondary">Cancel</button>
                    </form>
                </div>
            </div>
            
            <!-- Edit Faculty Form (Modal) -->
            <div id="editFormModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <span onclick="closeEditForm()" class="close">&times;</span>
                    <h2>Edit Faculty Member</h2>
                    <form id="editFacultyForm">
                        <input type="hidden" id="edit_faculty_id">
                        <div class="form-group">
                            <label for="edit_name">Name:</label>
                            <input type="text" id="edit_name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_department">Department:</label>
                            <input type="text" id="edit_department" name="department" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_designation">Designation:</label>
                            <select id="edit_designation" name="designation" required>
                                <option>Select Designation</option>
                                <option>Professor</option>
                                <option>Associate Professor</option>
                                <option>Assistant Professor</option>
                                <option>Lecturer</option>
                                <option>Guest Faculty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="edit_mobile">Mobile:</label>
                            <input type="tel" id="edit_mobile" name="mobile" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_email">Email:</label>
                            <input type="email" id="edit_email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="edit_specialization">Specialization:</label>
                            <input type="text" id="edit_specialization" name="specialization" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Faculty</button>
                        <button type="button" onclick="closeEditForm()" class="btn btn-secondary">Cancel</button>
                    </form>
                </div>
            </div>
            
            <!-- Faculty Table -->
            <div class="table-container">
                <table id="facultyTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Specialization</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="facultyTableBody">
                    </tbody>
                </table>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Load faculty data on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth('admin');
            loadFaculty();
        });
        
        // Add faculty form submission
        document.getElementById('addFacultyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('http://localhost:8080/api/faculty', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': sessionStorage.getItem('authToken')
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
            
                if (result.success) {
                    showMessage('Faculty added successfully!', 'success');
                    closeAddForm();
                loadFaculty();
                    this.reset();
                } else {
                    showMessage(result.message || 'Error adding faculty', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error, 'error');
            }
        });
        
        // Edit faculty form submission
        document.getElementById('editFacultyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const facultyId = document.getElementById('edit_faculty_id').value;
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch(`http://localhost:8080/api/faculty/${facultyId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': sessionStorage.getItem('authToken')
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Faculty updated successfully!', 'success');
                    closeEditForm();
                    loadFaculty();
                } else {
                    showMessage(result.message || 'Error updating faculty', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error, 'error');
            }
        });
        
        function loadFaculty() {
            fetch('http://localhost:8080/api/faculty', {
                headers: {
                    'Authorization': sessionStorage.getItem('authToken')
                }
            })
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('facultyTableBody');
                tbody.innerHTML = '';
                
                if (Array.isArray(data)) {
                    data.forEach(person => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${person.faculty_id}</td>
                            <td>${person.name}</td>
                            <td>${person.department}</td>
                            <td>${person.designation}</td>
                            <td>${person.mobile}</td>
                            <td>${person.email}</td>
                            <td>${person.specialization}</td>
                            <td>
                                <button onclick="editFaculty('${person.faculty_id}')" class="btn btn-small btn-info">✏️ Edit</button>
                                <button onclick="deleteFaculty('${person.faculty_id}')" class="btn btn-small btn-danger">🗑️ Delete</button>
                            </td>
                        `;
                    });
                }
            })
            .catch(err => showMessage('Error loading faculty: ' + err, 'error'));
        }
        
        function showAddForm() {
            document.getElementById('addFormModal').style.display = 'block';
            }
            
        function closeAddForm() {
            document.getElementById('addFormModal').style.display = 'none';
        }
        
        function editFaculty(facultyId) {
            fetch(`http://localhost:8080/api/faculty/${facultyId}`, {
                headers: {
                    'Authorization': sessionStorage.getItem('authToken')
                }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('edit_faculty_id').value = data.faculty_id;
                document.getElementById('edit_name').value = data.name;
                document.getElementById('edit_department').value = data.department;
                document.getElementById('edit_designation').value = data.designation;
                document.getElementById('edit_mobile').value = data.mobile;
                document.getElementById('edit_email').value = data.email;
                document.getElementById('edit_specialization').value = data.specialization;
                
                document.getElementById('editFormModal').style.display = 'block';
            })
            .catch(err => showMessage('Error loading faculty data: ' + err, 'error'));
        }
        
        function closeEditForm() {
            document.getElementById('editFormModal').style.display = 'none';
        }
        
        function deleteFaculty(facultyId) {
            if (confirm('Are you sure you want to delete this faculty member?')) {
                fetch(`http://localhost:8080/api/faculty/${facultyId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': sessionStorage.getItem('authToken')
                    }
                })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        showMessage('Faculty deleted successfully!', 'success');
                        loadFaculty();
                    } else {
                        showMessage(result.message || 'Error deleting faculty', 'error');
                    }
                })
                .catch(err => showMessage('Error: ' + err, 'error'));
            }
        }
        
        function searchFaculty() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                    loadFaculty();
                return;
            }
            
            fetch(`http://localhost:8080/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('facultyTableBody');
                tbody.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(person => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${person.faculty_id}</td>
                            <td>${person.name}</td>
                            <td>${person.department}</td>
                            <td>${person.designation}</td>
                            <td>${person.mobile}</td>
                            <td>${person.email}</td>
                            <td>${person.specialization}</td>
                            <td>
                                <button onclick="editFaculty('${person.faculty_id}')" class="btn btn-small btn-info">✏️ Edit</button>
                                <button onclick="deleteFaculty('${person.faculty_id}')" class="btn btn-small btn-danger">🗑️ Delete</button>
                            </td>
                        `;
                    });
                    showMessage(`Found ${data.count} result(s)`, 'success');
                } else {
                    showMessage('No results found', 'info');
                }
            })
            .catch(err => showMessage('Search error: ' + err, 'error'));
        }
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'message ' + type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }, 4000);
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
                }
        
        // Display username
        document.getElementById('username-display').textContent = 'Welcome, ' + sessionStorage.getItem('username');
    </script>
</body>
</html>
