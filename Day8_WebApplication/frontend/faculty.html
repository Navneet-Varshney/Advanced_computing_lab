<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Faculty Database</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-user-graduate"></i> Faculty Dashboard</h1>
        <div class="nav-buttons">
            <span><i class="fas fa-user-circle"></i> <span id="username-display"></span></span>
            <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    
    <!-- Faculty Navigation Tabs -->
    <div class="container">
        <div class="faculty-tabs">
            <button class="faculty-tab-button active" onclick="switchTab('profile')">
                <i class="fas fa-id-card"></i> Profile
            </button>
            <button class="faculty-tab-button" onclick="switchTab('update')">
                <i class="fas fa-edit"></i> Update
            </button>
            <button class="faculty-tab-button" onclick="switchTab('members')">
                <i class="fas fa-users"></i> Members
            </button>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard">
            <!-- PROFILE TAB -->
            <div id="profile-tab" class="faculty-tab-content active">
                <div class="info-section">
                    <h2><i class="fas fa-user-card"></i> My Profile Information</h2>
                    <div class="profile-info" id="profileInfo">
                        <div style="text-align: center; padding: 30px;">
                            <div class="spinner"></div>
                            <p style="margin-top: 15px; color: #999;">Loading profile...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- UPDATE TAB -->
            <div id="update-tab" class="faculty-tab-content" style="display: none;">
                <div class="edit-section">
                    <h2><i class="fas fa-edit"></i> Update Contact Information</h2>
                    <p><i class="fas fa-info-circle"></i> You can only update your Mobile Number and Email Address</p>
                    <form id="updateContactForm">
                        <div class="form-group">
                            <label for="edit_mobile"><i class="fas fa-phone"></i> Mobile Number</label>
                            <input type="tel" id="edit_mobile" name="mobile" placeholder="10-digit number" pattern="[0-9]{10}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="edit_email"><i class="fas fa-envelope"></i> Email Address</label>
                            <input type="email" id="edit_email" name="email" placeholder="your.email@example.com" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;"><i class="fas fa-save"></i> Save Changes</button>
                    </form>
                </div>
            </div>
            
            <!-- MEMBERS TAB -->
            <div id="members-tab" class="faculty-tab-content" style="display: none;">
                <div class="search-section">
                    <h2><i class="fas fa-search"></i> Search Faculty Directory</h2>
                    <div class="action-buttons">
                        <input type="text" id="searchInput" placeholder="Search by name, department, email, specialization, or designation..." class="search-box">
                        <button onclick="searchFaculty()" class="btn btn-info"><i class="fas fa-search"></i> Search</button>
                        <button onclick="resetFacultySearch()" class="btn btn-secondary"><i class="fas fa-redo"></i> Show All</button>
                    </div>
                </div>
                
                <!-- Faculty Table -->
                <div class="table-container">
                    <table id="facultyTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>Mobile</th>
                                <th>Email</th>
                                <th>Specialization</th>
                            </tr>
                        </thead>
                        <tbody id="facultyTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentFacultyId = null;
        
        // Load faculty data on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth('faculty');
            loadMyProfile();
            loadAllFaculty();
        });
        
        // Tab switching function
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.faculty-tab-content').forEach(tab => {
                tab.style.display = 'none';
                tab.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.faculty-tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + '-tab').style.display = 'block';
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // Add active class to clicked button
            event.target.closest('.faculty-tab-button').classList.add('active');
        }
        
        function loadMyProfile() {
            const username = sessionStorage.getItem('username');
            const facultyId = sessionStorage.getItem('faculty_id');
            
            if (facultyId) {
                fetch(API_BASE + `/api/faculty/${facultyId}`, {
                    headers: {
                        'Authorization': sessionStorage.getItem('authToken')
                    }
                })
                .then(res => res.json())
                .then(data => {
                    currentFacultyId = data.faculty_id;
                    
                    document.getElementById('profileInfo').innerHTML = `
                        <div class="info-grid">
                            <div class="info-item">
                                <strong>Faculty ID:</strong> ${data.faculty_id}
                            </div>
                            <div class="info-item">
                                <strong>Name:</strong> ${data.name}
                            </div>
                            <div class="info-item">
                                <strong>Department:</strong> ${data.department}
                            </div>
                            <div class="info-item">
                                <strong>Designation:</strong> ${data.designation}
                            </div>
                            <div class="info-item">
                                <strong>Mobile:</strong> ${data.mobile}
                            </div>
                            <div class="info-item">
                                <strong>Email:</strong> ${data.email}
                            </div>
                            <div class="info-item">
                                <strong>Specialization:</strong> ${data.specialization}
                            </div>
                        </div>
                    `;
                    
                    // Pre-fill edit form
                    document.getElementById('edit_mobile').value = data.mobile;
                    document.getElementById('edit_email').value = data.email;
                })
                .catch(err => showMessage('Error loading profile: ' + err, 'error'));
            }
        }
        
        function loadAllFaculty() {
            fetch(API_BASE + '/api/faculty', {
                headers: {
                    'Authorization': sessionStorage.getItem('authToken')
                }
            })
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('facultyTableBody');
                tbody.innerHTML = '';
                
                if (Array.isArray(data)) {
                    // Sort by faculty_id numerically
                    data.sort((a, b) => {
                        const idA = parseInt(a.faculty_id) || 999999;
                        const idB = parseInt(b.faculty_id) || 999999;
                        return idA - idB;
                    });
                    
                    data.forEach(person => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${person.faculty_id}</td>
                            <td>${person.name}</td>
                            <td>${person.department}</td>
                            <td>${person.designation}</td>
                            <td>${person.mobile}</td>
                            <td>${person.email}</td>
                            <td>${person.specialization}</td>
                        `;
                    });
                }
            })
            .catch(err => showMessage('Error loading faculty: ' + err, 'error'));
        }
        
        // Update contact information
        document.getElementById('updateContactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!currentFacultyId) {
                showMessage('Faculty ID not found', 'error');
                return;
            }
            
            const mobile = document.getElementById('edit_mobile').value;
            const email = document.getElementById('edit_email').value;
            
            try {
                const response = await fetch(API_BASE + `/api/faculty/${currentFacultyId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': sessionStorage.getItem('authToken')
                    },
                    body: JSON.stringify({ mobile, email })
                })
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Contact information updated successfully!', 'success');
                    loadMyProfile();
                } else {
                    showMessage(result.message || 'Error updating information', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error, 'error');
            }
        });
        
        function searchFaculty() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadAllFaculty();
                return;
            }
            
            fetch(API_BASE + `/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('facultyTableBody');
                tbody.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(person => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${person.faculty_id}</td>
                            <td>${person.name}</td>
                            <td>${person.department}</td>
                            <td>${person.designation}</td>
                            <td>${person.mobile}</td>
                            <td>${person.email}</td>
                            <td>${person.specialization}</td>
                        `;
                    });
                    showMessage(`Found ${data.count} result(s)`, 'success');
                } else {
                    showMessage('No results found', 'info');
                }
            })
            .catch(err => showMessage('Search error: ' + err, 'error'));
        }
        
        function resetFacultySearch() {
            document.getElementById('searchInput').value = '';
            loadAllFaculty();
        }
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'message ' + type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }, 4000);
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
        
        // Display username
        document.getElementById('username-display').textContent = 'Welcome, ' + sessionStorage.getItem('username');
    </script>
</body>
</html>
